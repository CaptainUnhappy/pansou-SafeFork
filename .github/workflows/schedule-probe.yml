name: Schedule Probe (temporary)

on:
  schedule:
    - cron: "3/5 * * * *"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record natural schedule event
        shell: bash
        run: |
          date -u
          printf 'event=%s ref=%s sha=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA"
